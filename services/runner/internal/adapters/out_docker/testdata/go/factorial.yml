input:
    lang: Go
    code: |
        package main

        import "fmt"

        func factorial(n int) int {
            if n == 0 {
                return 1
            }
            return n * factorial(n-1)
        }

        func main() {
            var n int
            fmt.Scan(&n)
            for i := 0; i < n; i++ {
                var val int
                fmt.Scan(&val)
                fmt.Println(factorial(val))
            }
        }
    stdin:
        - |
          3
        - |
          5
        - |
          7
        - |
          0
output:
    stdout: |
        120
        5040
        1
    stderr: ""
